services:
  db:
    image: mysql:8.0
    container_name: kaskita_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-kaskita}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    container_name: kaskita_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      DB_NAME: ${DB_NAME:-kaskita}
      JWT_SECRET: ${JWT_SECRET:-ganti-secret-ini}
      # Opsional: isi kalau mau OTP beneran dikirim ke email (kalau kosong, OTP dicetak di log)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-KasKita <no-reply@kaskita.app>}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads:
